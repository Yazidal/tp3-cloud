services:
  api:
    build: .
    image: tp3-api
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquante}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET manquante}
      S3_REGION: ${S3_REGION:?S3_REGION manquante}
      APP_VERSION: "1.0.0"
    ports:
      - "8000:8000"
    restart: unless-stopped
