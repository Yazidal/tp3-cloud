x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@postgres:5432/${POSTGRES_DB:-app}
  # En local : endpoint + clés statiques. Sur AWS : supprimer ces 3 lignes,
  # boto3 utilisera alors le rôle d'instance.
  S3_ENDPOINT_URL: http://s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
  S3_BUCKET: ${S3_BUCKET:-datasets}
  S3_REGION: ${S3_REGION:-us-east-1}

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 3s
      retries: 20

  # Remplace MinIO : minio/minio n'est plus publié sur Docker Hub ni sur Quay.
  # versitygw est une passerelle S3 (SigV4, path-style) adossée à un volume.
  s3:
    image: versity/versitygw:latest
    command:
      - --access
      - ${S3_ACCESS_KEY:-minioadmin}
      - --secret
      - ${S3_SECRET_KEY:-minioadmin123}
      - --region
      - ${S3_REGION:-us-east-1}
      - --port
      - ":9000"
      - posix
      - /data
    ports:
      - "9000:9000" # API S3 (permet de tester depuis l'hôte)
    volumes:
      - s3data:/data

  bootstrap:
    build: .
    image: tp3-api
    command: python bootstrap.py
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
    restart: "no"

  api:
    build: .
    image: tp3-api
    environment: *api-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started
      bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:
  s3data:
